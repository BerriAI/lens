suite: Lens resource ownership handoff
templates:
  - resources.yaml
release:
  name: independent-lens
  namespace: lens
tests:
  - it: preserves the existing deployment and storage selectors during adoption
    set:
      fullnameOverride: gateway-lens-worker
      instanceOverride: gateway
      component: lens-worker
      clickhouse.nameOverride: gateway-lens-clickhouse
    asserts:
      - equal:
          path: metadata.name
          value: gateway-lens-worker
        documentSelector: {path: kind, value: Deployment}
      - equal:
          path: spec.selector.matchLabels
          value: {app.kubernetes.io/instance: gateway, app.kubernetes.io/component: lens-worker}
        documentSelector: {path: kind, value: Deployment}
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/instance"]
          value: gateway
        documentSelector: {path: kind, value: Deployment}
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/instance"]
          value: gateway
        documentSelector: {path: kind, value: StatefulSet}
      - equal:
          path: spec.selector
          value: {app.kubernetes.io/instance: gateway, app.kubernetes.io/component: lens-worker}
        documentSelector: {path: "spec.ports[0].name", value: otlp}
  - it: allows the old release to relinquish retained application resources
    set:
      retainResources: true
      ingress.enabled: true
      ingress.host: lens.example
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
        documentSelector: {path: kind, value: Deployment}
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
        documentSelector: {path: kind, value: StatefulSet}
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
        documentSelector: {path: kind, value: ConfigMap}
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
        documentSelector: {path: kind, value: Ingress}
