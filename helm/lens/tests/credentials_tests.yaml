suite: Lens credentials survive upgrades
templates:
  - resources.yaml
release:
  name: lens
  namespace: lens
  upgrade: true
kubernetesProvider:
  scheme:
    v1/Secret:
      gvr: {version: v1, resource: secrets}
      namespaced: true
  objects:
    - apiVersion: v1
      kind: Secret
      metadata: {name: lens-admin, namespace: lens}
      data: {admin-token: cHJlc2VydmVkLWFkbWluLXRva2Vu}
    - apiVersion: v1
      kind: Secret
      metadata: {name: lens-clickhouse, namespace: lens}
      data: {password: cHJlc2VydmVkLWRhdGFiYXNlLXBhc3N3b3Jk}
    - apiVersion: v1
      kind: Secret
      metadata: {name: lens-gateway, namespace: lens}
      data: {gateway-secret: cHJlc2VydmVkLXNpZ25pbmcta2V5}
tests:
  - it: keeps the signing credential distinct from service access across upgrades
    set:
      gateway.enabled: true
    documentSelector: {path: metadata.name, value: lens-gateway}
    asserts:
      - equal: {path: data.gateway-secret, value: cHJlc2VydmVkLXNpZ25pbmcta2V5}
      - notExists: {path: data.service-token}
  - it: keeps the existing login credential
    documentSelector: {path: metadata.name, value: lens-admin}
    asserts:
      - equal: {path: data.admin-token, value: cHJlc2VydmVkLWFkbWluLXRva2Vu}
      - equal: {path: 'metadata.annotations["helm.sh/resource-policy"]', value: keep}
  - it: keeps the database password that protects existing records
    documentSelector: {path: data.password, value: cHJlc2VydmVkLWRhdGFiYXNlLXBhc3N3b3Jk}
    asserts:
      - equal: {path: data.password, value: cHJlc2VydmVkLWRhdGFiYXNlLXBhc3N3b3Jk}
