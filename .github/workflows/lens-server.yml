name: lens-server

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
      - name: Check backend language boundary
        shell: bash
        run: |
          unexpected=$(git ls-files '*.py' ':!:src/sdk/**' ':!:src/worker/crates/lens/sandbox/python_runtime.py')
          if [ -n "$unexpected" ]; then
            printf 'Python outside the SDK and sandbox is not supported:\n%s\n' "$unexpected"
            exit 1
          fi
      - name: Check formatting
        working-directory: src/worker
        run: cargo fmt --check
      - name: Run Clippy
        working-directory: src/worker
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Start shared ClickHouse state fixture
        run: |
          set -euo pipefail
          docker run --detach --name lens-rust-state \
            --publish 127.0.0.1::8123 \
            --env CLICKHOUSE_SKIP_USER_SETUP=1 \
            --mount "type=bind,source=$GITHUB_WORKSPACE/src/worker/crates/storage-clickhouse/tests/state/fixtures/keeper.xml,target=/etc/clickhouse-server/config.d/lens-keeper.xml,readonly" \
            clickhouse/clickhouse-server:26.9.6.6@sha256:eb4870e7ca7ed70c259eebfcfbee6cf797017f6b5436c2926bbbfe3d4d28486e
          ready=false
          for attempt in {1..60}; do
            if docker exec lens-rust-state clickhouse-client \
              --query "SELECT count() FROM system.zookeeper WHERE path = '/'" >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo 'ClickHouse and Keeper did not become ready'
            exit 1
          fi
          printf 'CLICKHOUSE_STATE_TEST_URL=http://%s\n' "$(docker port lens-rust-state 8123/tcp)" >> "$GITHUB_ENV"
      - name: Run tests
        working-directory: src/worker
        run: cargo test --locked --workspace -- --test-threads=2
      - name: Diagnose failed tests
        if: failure()
        run: |
          docker inspect --format '{{json .State}}' lens-rust-state || true
          docker logs --tail 200 lens-rust-state || true
          docker exec lens-rust-state tail -n 200 /var/log/clickhouse-server/clickhouse-server.err.log || true
      - name: Remove shared state fixture
        if: always()
        run: docker rm --force --volumes lens-rust-state || true

  worker-ui-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.1
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:worker-contract
      - run: npm run typecheck:ui
      - name: Check setup and workspace behavior
        run: >-
          npm exec --workspace @litellm/lens-ui -- vitest run
          src/components/lens/onboarding
          src/components/lens/agents
          src/components/lens/evals
          src/components/lens/settings
          src/components/lens/investigations
          src/components/lens/LensNavigation.integration.test.tsx
          src/components/lens/LensSetup.integration.test.tsx
          src/components/lens/LensWorkspace.integration.test.tsx
          --maxWorkers 2

  standalone-container:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build standalone Lens
        run: docker build --build-arg LENS_VERSION=ci -f deploy/runtime/Dockerfile -t lens:ci .
      - name: Scan the native runtime for fixable high and critical vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch=amd64; checksum=edda0968d8827daab01d32b3cd7de192ae0915005e7bbfcfef9e68e79bc43343 ;;
            aarch64) arch=arm64; checksum=553e4c36d9d61349830ba6034d43b8700a7f10576d3e2f4981c0fd2b96086465 ;;
            *) exit 1 ;;
          esac
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/grype.tar.gz" \
            "https://github.com/anchore/grype/releases/download/v0.114.0/grype_0.114.0_linux_$arch.tar.gz"
          printf '%s  %s\n' "$checksum" "$RUNNER_TEMP/grype.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/grype.tar.gz" -C "$RUNNER_TEMP" grype
          "$RUNNER_TEMP/grype" lens:ci --only-fixed --fail-on high --output json > "$RUNNER_TEMP/lens-vulnerabilities.json"
      - name: Retain the native vulnerability report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lens-vulnerabilities-${{ runner.arch }}
          path: ${{ runner.temp }}/lens-vulnerabilities.json
          if-no-files-found: warn
      - name: Start and restart with ClickHouse
        run: deploy/lens/smoke.sh lens:ci ci
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.1
      - name: Recover populated deployment
        run: node deploy/lens/recovery-smoke.mjs lens:ci
      - name: Check authentication and storage outage recovery
        run: node deploy/lens/qualify-runtime.mjs lens:ci
      - name: Migrate a read-only PostgreSQL fixture using the packaged command
        run: node deploy/lens/qualify-migration.mjs lens:ci
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Build and qualify the SDK wheel against the packaged service
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          python -m pip install uv==0.10.9
          uv build --wheel --project src/sdk --out-dir "$RUNNER_TEMP/lens-sdk"
          node deploy/lens/qualify-sdk.mjs lens:ci "$RUNNER_TEMP"/lens-sdk/*.whl
      - name: Build calculation sandbox tests
        run: docker build --target smoke --build-arg LENS_VERSION=ci -f deploy/runtime/Dockerfile -t lens:smoke .
      - name: Check calculation confinement on the native kernel
        run: >-
          docker run --rm --read-only --cap-drop ALL
          --security-opt no-new-privileges --network none
          --pids-limit 128 --memory 2g --cpus 2
          --tmpfs /tmp:rw,noexec,nosuid,size=1g lens:smoke
