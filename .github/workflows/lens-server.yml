name: lens-server

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
      - name: Check backend language boundary
        shell: bash
        run: |
          unexpected=$(git ls-files '*.py' ':!:src/sdk/**' ':!:src/cli/python/**' ':!:src/cli/tests/python/**' ':!:src/cli/examples/local_eval/**' ':!:src/worker/crates/lens/sandbox/python_runtime.py')
          if [ -n "$unexpected" ]; then
            printf 'Python outside the SDK, CLI adapters and sandbox is not supported:\n%s\n' "$unexpected"
            exit 1
          fi
      - name: Check formatting
        working-directory: src/worker
        run: cargo fmt --check
      - name: Run Clippy
        working-directory: src/worker
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Check trace schema drift
        working-directory: src/worker
        run: |
          cargo run --locked --quiet -p litellm-traces --features schema --bin export-traces-schema -- --ui > "$RUNNER_TEMP/lens-traces.json"
          diff -u ../../schema/lens-traces.json "$RUNNER_TEMP/lens-traces.json"
      - name: Start shared ClickHouse state fixture
        run: |
          set -euo pipefail
          docker run --detach --name lens-rust-state \
            --publish 127.0.0.1::8123 \
            --env CLICKHOUSE_SKIP_USER_SETUP=1 \
            --mount "type=bind,source=$GITHUB_WORKSPACE/src/worker/crates/storage-clickhouse/tests/state/fixtures/keeper.xml,target=/etc/clickhouse-server/config.d/lens-keeper.xml,readonly" \
            clickhouse/clickhouse-server:26.9.6.6@sha256:eb4870e7ca7ed70c259eebfcfbee6cf797017f6b5436c2926bbbfe3d4d28486e
          ready=false
          for attempt in {1..60}; do
            if docker exec lens-rust-state clickhouse-client \
              --query "SELECT count() FROM system.zookeeper WHERE path = '/'" >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo 'ClickHouse and Keeper did not become ready'
            exit 1
          fi
          printf 'CLICKHOUSE_STATE_TEST_URL=http://%s\n' "$(docker port lens-rust-state 8123/tcp)" >> "$GITHUB_ENV"
      - name: Run tests
        working-directory: src/worker
        run: cargo test --locked --workspace --no-fail-fast -- --test-threads=2
      - name: Diagnose failed tests
        if: failure()
        run: |
          docker inspect --format '{{json .State}}' lens-rust-state || true
          docker logs --tail 200 lens-rust-state || true
          docker exec lens-rust-state tail -n 200 /var/log/clickhouse-server/clickhouse-server.err.log || true
      - name: Remove shared state fixture
        if: always()
        run: docker rm --force --volumes lens-rust-state || true

  worker-ui-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.1
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:worker-contract
      - run: npm run check:trace-contract
      - run: npm run typecheck:ui
      - name: Check setup and workspace behavior
        run: >-
          npm exec --workspace @litellm/lens-ui -- vitest run
          src/components/lens/onboarding
          src/components/lens/agents
          src/components/lens/evals
          src/components/lens/optimizations
          src/components/lens/settings
          src/components/lens/investigations
          src/components/lens/traces
          src/components/lens/profiles
          src/components/lens/setup
          src/components/lens/model/analysisModels.test.ts
          src/components/lens/LensNavigation.integration.test.tsx
          src/components/lens/LensSetup.integration.test.tsx
          src/components/lens/LensWorkspace.integration.test.tsx
          --maxWorkers 2

  standalone-container:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build standalone Lens
        run: docker build --build-arg LENS_VERSION=ci -f deploy/runtime/Dockerfile -t lens:ci .
      - name: Build native agents
        run: docker build --target agents -f deploy/runtime/Dockerfile -t lens-agents:ci .
      - name: Verify confined code execution
        run: |
          docker build --target smoke -f deploy/runtime/Dockerfile -t lens-sandbox:ci .
          timeout 180 docker run --rm --read-only --cap-drop ALL \
            --security-opt no-new-privileges --network none --cpus 2 --memory 1g --pids-limit 32 \
            --ulimit fsize=16777216:16777216 --tmpfs /tmp:rw,noexec,nosuid,size=256m \
            lens-sandbox:ci
      - name: Verify native model tool boundaries
        run: |
          docker build --target agents-smoke -f deploy/runtime/Dockerfile -t lens-agents-smoke:ci .
          timeout 180 docker run --rm --read-only --cap-drop ALL \
            --cap-add CHOWN --cap-add FOWNER --cap-add SETUID --cap-add SETGID --cap-add DAC_OVERRIDE --cap-add KILL \
            --security-opt no-new-privileges --network none --cpus 2 --memory 2g --pids-limit 128 \
            --ulimit fsize=67108864:67108864 --tmpfs /tmp:rw,nosuid,size=512m \
            lens-agents-smoke:ci
      - name: Scan the native runtime for fixable high and critical vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch=amd64; checksum=edda0968d8827daab01d32b3cd7de192ae0915005e7bbfcfef9e68e79bc43343 ;;
            aarch64) arch=arm64; checksum=553e4c36d9d61349830ba6034d43b8700a7f10576d3e2f4981c0fd2b96086465 ;;
            *) exit 1 ;;
          esac
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/grype.tar.gz" \
            "https://github.com/anchore/grype/releases/download/v0.114.0/grype_0.114.0_linux_$arch.tar.gz"
          printf '%s  %s\n' "$checksum" "$RUNNER_TEMP/grype.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/grype.tar.gz" -C "$RUNNER_TEMP" grype
          "$RUNNER_TEMP/grype" lens:ci --only-fixed --fail-on high --output json > "$RUNNER_TEMP/lens-vulnerabilities.json"
          "$RUNNER_TEMP/grype" lens-agents:ci --only-fixed --fail-on high --output json > "$RUNNER_TEMP/lens-agent-vulnerabilities.json"
      - name: Retain the native vulnerability report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lens-vulnerabilities-${{ runner.arch }}
          path: ${{ runner.temp }}/*vulnerabilities.json
          if-no-files-found: warn
      - name: Check start script image selection
        run: deploy/lens/start-test.sh
      - name: Start and restart with ClickHouse
        run: deploy/lens/smoke.sh lens:ci ci lens-agents:ci
      - name: Check native runtime entry points
        run: |
          docker run --rm --entrypoint /opt/hermes/.venv/bin/hermes lens-agents:ci --version
          docker run --rm --entrypoint /opt/deepagents/bin/dcode lens-agents:ci --version
