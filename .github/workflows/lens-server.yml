name: lens-server

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
      - name: Check backend language boundary
        shell: bash
        run: |
          unexpected=$(git ls-files '*.py' ':!:src/sdk/**' ':!:src/worker/crates/lens/sandbox/python_runtime.py')
          if [ -n "$unexpected" ]; then
            printf 'Python outside the SDK and sandbox is not supported:\n%s\n' "$unexpected"
            exit 1
          fi
      - name: Check formatting
        working-directory: src/worker
        run: cargo fmt --check
      - name: Run Clippy
        working-directory: src/worker
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Run tests
        working-directory: src/worker
        run: cargo test --locked --workspace -- --test-threads=2

  worker-ui-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.1
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:worker-contract
      - run: npm run typecheck:ui
      - name: Check setup and workspace behavior
        run: >-
          npm exec --workspace @litellm/lens-ui -- vitest run
          src/components/lens/onboarding
          src/components/lens/LensSetup.integration.test.tsx
          src/components/lens/LensWorkspace.integration.test.tsx
          --maxWorkers 2

  standalone-container:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build standalone Lens
        run: docker build --build-arg LENS_VERSION=ci -f deploy/runtime/Dockerfile -t lens:ci .
      - name: Start and restart with ClickHouse
        run: deploy/lens/smoke.sh lens:ci ci
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.1
      - name: Recover populated deployment
        run: node deploy/lens/recovery-smoke.mjs lens:ci
      - name: Check authentication and storage outage recovery
        run: node deploy/lens/qualify-runtime.mjs lens:ci
      - name: Migrate a read-only PostgreSQL fixture using the packaged command
        run: node deploy/lens/qualify-migration.mjs lens:ci
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Build and qualify the SDK wheel against the packaged service
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          python -m pip install uv==0.10.9
          uv build --wheel --project src/sdk --out-dir "$RUNNER_TEMP/lens-sdk"
          node deploy/lens/qualify-sdk.mjs lens:ci "$RUNNER_TEMP"/lens-sdk/*.whl
      - name: Build calculation sandbox tests
        run: docker build --target smoke --build-arg LENS_VERSION=ci -f deploy/runtime/Dockerfile -t lens:smoke .
      - name: Check calculation confinement on the native kernel
        run: >-
          docker run --rm --read-only --cap-drop ALL
          --security-opt no-new-privileges --network none
          --pids-limit 128 --memory 2g --cpus 2
          --tmpfs /tmp:rw,noexec,nosuid,size=1g lens:smoke
