name: lens-agent

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-agents:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: rustup toolchain install 1.99.0 --profile minimal
      - name: Check shared results, continuity and AgentChat transport
        working-directory: src/worker
        run: cargo test --locked -p lens-agents
