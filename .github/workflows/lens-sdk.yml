name: Lens SDK
on:
  push:
    branches: [main, litellm_eval_sdk]
    paths: ['packages/sdk/**', 'schema/lens.v1.json', 'runtime/crates/contract/**', '.github/workflows/lens-sdk.yml']
  pull_request:
    paths: ['packages/sdk/**', 'schema/lens.v1.json', 'runtime/crates/contract/**', '.github/workflows/lens-sdk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.10.9
      - run: uv sync --project packages/sdk --frozen
      - run: uv run --project packages/sdk ruff check packages/sdk
      - run: uv run --project packages/sdk ruff format --check packages/sdk
      - run: uv run --project packages/sdk mypy packages/sdk/src/lens packages/sdk/scripts/generate_contract.py
      - name: Check generated contract drift
        shell: bash
        run: |
          schema=schema/lens.v1.json
          if [[ ! -f "$schema" ]]; then
            echo '::warning::Rust eval schema is pending. Checking the provisional appendix schema.'
            schema=packages/sdk/tests/fixtures/appendix.v1.json
          fi
          uv run --project packages/sdk python packages/sdk/scripts/generate_contract.py --schema "$schema" --check
      - run: uv run --project packages/sdk pytest packages/sdk/tests --cov=lens --cov-config=packages/sdk/pyproject.toml
      - run: uv build --project packages/sdk --out-dir packages/sdk/dist
      - name: Check wheel in a fresh environment
        shell: bash
        run: |
          uv venv /tmp/lens-wheel
          uv pip install --python /tmp/lens-wheel/bin/python packages/sdk/dist/*.whl
          /tmp/lens-wheel/bin/lens --help
  action:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Start the contract stub
        shell: bash
        run: |
          python -m pip install './packages/sdk[dev-server]'
          lens dev-server > /tmp/lens-dev-server.log 2>&1 &
          printf '\n[tool.lens]\nproject="demo"\n' >> pyproject.toml
          for attempt in {1..30}; do
            if curl --fail --silent -H 'Authorization: Bearer lens-dev' -H 'X-Lens-Contract: 1' 'http://127.0.0.1:8765/lens/datasets/resolve?name=demo'; then break; fi
            sleep 1
          done
      - uses: ./packages/sdk/action
        id: lens
        with:
          api-key: lens-dev
          base-url: http://127.0.0.1:8765
          path: packages/sdk/examples/demo.py
      - name: Verify Action outputs
        env:
          PASSED: ${{ steps.lens.outputs.passed }}
          URLS: ${{ steps.lens.outputs.run-urls }}
        run: |
          test "$PASSED" = true
          python -c 'import json, os; assert len(json.loads(os.environ["URLS"])) == 1'
