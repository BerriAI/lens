name: Lens SDK
on:
  push:
    branches: [main, litellm_sdk_setup]
    paths: ['packages/sdk/**', 'schema/lens.v1.json', 'runtime/crates/contract/**', 'runtime/crates/evals-sdk/**', 'runtime/crates/evals-python/**', 'runtime/Cargo.toml', 'runtime/Cargo.lock', '.github/workflows/lens-sdk.yml']
  pull_request:
    paths: ['packages/sdk/**', 'schema/lens.v1.json', 'runtime/crates/contract/**', 'runtime/crates/evals-sdk/**', 'runtime/crates/evals-python/**', 'runtime/Cargo.toml', 'runtime/Cargo.lock', '.github/workflows/lens-sdk.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.99.0
jobs:
  sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
      - run: python -m pip install uv==0.10.9
      - run: cargo fmt --manifest-path runtime/Cargo.toml -p lens-evals-sdk -p lens-evals-python --check
      - run: cargo clippy --manifest-path runtime/Cargo.toml -p lens-evals-sdk -p lens-evals-python --all-targets -- -D warnings
      - run: cargo test --manifest-path runtime/Cargo.toml -p lens-evals-sdk
      - run: uv sync --project packages/sdk --frozen
      - run: uv run --project packages/sdk ruff check packages/sdk
      - run: uv run --project packages/sdk ruff format --check packages/sdk
      - run: uv run --project packages/sdk mypy packages/sdk/src/lens packages/sdk/scripts/generate_contract.py
      - name: Check generated contract drift
        shell: bash
        run: |
          schema=schema/lens.v1.json
          if [[ ! -f "$schema" ]]; then
            echo '::warning::Rust eval schema is pending. Checking the provisional appendix schema.'
            schema=packages/sdk/tests/fixtures/appendix.v1.json
          fi
          uv run --project packages/sdk python packages/sdk/scripts/generate_contract.py --schema "$schema" --check
      - run: uv run --project packages/sdk pytest packages/sdk/tests --cov=lens --cov-config=packages/sdk/pyproject.toml
      - run: uv build --project packages/sdk --out-dir packages/sdk/dist
      - name: Check wheel in a fresh environment
        shell: bash
        run: |
          uv venv /tmp/lens-wheel
          uv pip install --python /tmp/lens-wheel/bin/python packages/sdk/dist/*.whl
          /tmp/lens-wheel/bin/lens --help
  action:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Start the contract stub
        shell: bash
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          python -m pip install uv==0.10.9 './packages/sdk'
          uv venv /tmp/lens-agent-env
          uv pip install --python /tmp/lens-agent-env/bin/python httpx==0.28.1
          cp packages/sdk/examples/demo.py /tmp/lens-action-demo.py
          sed -i '1i import httpx' /tmp/lens-action-demo.py
          lens dev-server > /tmp/lens-dev-server.log 2>&1 &
          printf '\n[tool.lens]\nproject="demo"\n' >> pyproject.toml
          for attempt in {1..30}; do
            if curl --fail --silent -H 'Authorization: Bearer lens-dev' -H 'X-Lens-Contract: 1' 'http://127.0.0.1:8765/lens/datasets/resolve?name=demo'; then break; fi
            sleep 1
          done
      - uses: ./packages/sdk/action
        id: lens
        with:
          api-key: lens-dev
          base-url: http://127.0.0.1:8765
          path: /tmp/lens-action-demo.py
          python: /tmp/lens-agent-env/bin/python
      - name: Verify Action outputs
        env:
          PASSED: ${{ steps.lens.outputs.passed }}
          URLS: ${{ steps.lens.outputs.run-urls }}
        run: |
          test "$PASSED" = true
          python -c 'import json, os; assert len(json.loads(os.environ["URLS"])) == 1'
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: '2_28'
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: 'off'
          - runner: macos-15
            target: aarch64-apple-darwin
            manylinux: 'off'
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: 'off'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          working-directory: packages/sdk
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          rust-toolchain: 1.99.0
          maturin-version: v1.15.0
          args: --release --locked --out dist
      - name: Install and exercise the wheel
        shell: bash
        run: |
          python -m pip install --only-binary=:all: --find-links packages/sdk/dist lens-evals==0.1.0a2
          python -m pip install pytest==9.1.1 pytest-asyncio==1.4.0 httpx==0.28.1
          python -m lens.cli --help
          python -m pytest packages/sdk/tests/test_sdk.py -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lens-evals-${{ matrix.target }}
          path: packages/sdk/dist/*.whl
