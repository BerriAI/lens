name: Lens SDK
on:
  push:
    branches: [main, litellm_sdk_setup, litellm_sdk_contract_alignment]
    paths: ['src/sdk/**', 'schema/lens.v1.json', 'src/worker/crates/contract/**', 'src/worker/crates/evals-sdk/**', 'src/worker/crates/evals-python/**', 'src/worker/Cargo.toml', 'src/worker/Cargo.lock', '.github/workflows/lens-sdk.yml']
  pull_request:
    paths: ['src/sdk/**', 'schema/lens.v1.json', 'src/worker/crates/contract/**', 'src/worker/crates/evals-sdk/**', 'src/worker/crates/evals-python/**', 'src/worker/Cargo.toml', 'src/worker/Cargo.lock', '.github/workflows/lens-sdk.yml']
  workflow_dispatch:
    inputs:
      release_install:
        description: Test downloading the published release wheel in the Action
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: lens-sdk-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
env:
  RUSTUP_TOOLCHAIN: 1.99.0
jobs:
  sdk:
    if: inputs.release_install != true && (github.event_name != 'push' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
      - run: python -m pip install uv==0.10.9
      - run: cargo fmt --manifest-path src/worker/Cargo.toml -p lens-evals-sdk -p lens-evals-python --check
      - run: cargo clippy --manifest-path src/worker/Cargo.toml -p lens-evals-sdk -p lens-evals-python --all-targets -- -D warnings
      - run: cargo test --manifest-path src/worker/Cargo.toml -p lens-evals-sdk
      - run: uv sync --project src/sdk --frozen
      - run: uv run --project src/sdk ruff check src/sdk
      - run: uv run --project src/sdk ruff format --check src/sdk
      - run: uv run --project src/sdk mypy src/sdk/src/lens src/sdk/scripts/generate_contract.py
      - name: Check generated contract drift
        shell: bash
        run: |
          schema=schema/lens.v1.json
          if [[ ! -f "$schema" ]]; then
            echo '::warning::Rust eval schema is pending. Checking the provisional appendix schema.'
            schema=src/sdk/tests/fixtures/appendix.v1.json
          fi
          uv run --project src/sdk python src/sdk/scripts/generate_contract.py --schema "$schema" --check
      - run: uv run --project src/sdk pytest src/sdk/tests --cov=lens --cov-config=src/sdk/pyproject.toml
      - run: bash src/sdk/tests/install_action.sh
      - run: uv build --project src/sdk --out-dir src/sdk/dist
      - name: Check wheel in a fresh environment
        shell: bash
        run: |
          uv venv /tmp/lens-wheel
          uv pip install --python /tmp/lens-wheel/bin/python src/sdk/dist/*.whl
          /tmp/lens-wheel/bin/lens --help
  action:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Start the contract stub
        shell: bash
        env:
          RELEASE_INSTALL: ${{ inputs.release_install }}
          GH_TOKEN: ${{ github.token }}
          LENS_PYTHON: python
        run: |
          python -m pip install uv==0.10.9
          if [[ "$RELEASE_INSTALL" == true ]]; then
            bash src/sdk/action/install.sh
          else
            rustup toolchain install 1.99.0 --profile minimal
            python -m pip install './src/sdk'
          fi
          uv venv /tmp/lens-agent-env
          uv pip install --python /tmp/lens-agent-env/bin/python httpx==0.28.1
          cp src/sdk/examples/demo.py /tmp/lens-action-demo.py
          sed -i '1i import httpx' /tmp/lens-action-demo.py
          lens dev-server > /tmp/lens-dev-server.log 2>&1 &
          printf '\n[tool.lens]\nproject="demo"\n' >> pyproject.toml
          for attempt in {1..30}; do
            if curl --fail --silent -H 'Authorization: Bearer lens-dev' -H 'X-Lens-Contract: 1' 'http://127.0.0.1:8765/lens/datasets/resolve?name=demo'; then break; fi
            sleep 1
          done
      - uses: ./src/sdk/action
        id: lens
        with:
          api-key: lens-dev
          base-url: http://127.0.0.1:8765
          path: /tmp/lens-action-demo.py
          python: /tmp/lens-agent-env/bin/python
          install-from-source: ${{ !inputs.release_install }}
      - name: Verify Action outputs
        env:
          PASSED: ${{ steps.lens.outputs.passed }}
          URLS: ${{ steps.lens.outputs.run-urls }}
        run: |
          test "$PASSED" = true
          python -c 'import json, os; assert len(json.loads(os.environ["URLS"])) == 1'
  wheels:
    if: inputs.release_install != true && (github.event_name != 'push' || github.ref_name == 'main')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: '2_28'
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: 'off'
          - runner: macos-15
            target: aarch64-apple-darwin
            manylinux: 'off'
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: 'off'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          working-directory: src/sdk
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          rust-toolchain: 1.99.0
          maturin-version: v1.15.0
          args: --release --locked --out dist
      - name: Install and exercise the wheel
        shell: bash
        run: |
          python -m pip install --only-binary=:all: src/sdk/dist/*.whl
          python -m pip install pytest==9.1.1 pytest-asyncio==1.4.0 httpx==0.28.1
          python -m lens.cli --help
          python -m pytest src/sdk/tests/test_sdk.py -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lens-evals-${{ matrix.target }}
          path: src/sdk/dist/*.whl
