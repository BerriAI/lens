name: lens

services:
  credentials:
    image: ${LENS_IMAGE:-ghcr.io/berriai/lens:0.1.0}
    user: "0:0"
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        /usr/local/bin/litellm-lens init /setup
        chown "$$(stat -c %u:%g /setup)" /setup/.env
        cp /setup/.env /credentials/.env
        chown 65532:65532 /credentials/.env
        echo "Sign in at http://localhost:4318/ui/ with LENS_ADMIN_TOKEN from deploy/lens/.env"
    volumes:
      - .:/setup
      - credentials:/credentials
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    restart: "no"

  lens:
    image: ${LENS_IMAGE:-ghcr.io/berriai/lens:0.1.0}
    env_file:
      - path: .env
        required: false
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        export LENS_ADMIN_TOKEN="$$(sed -n 's/^LENS_ADMIN_TOKEN=//p' /credentials/.env)"
        export CLICKHOUSE_PASSWORD="$$(sed -n 's/^CLICKHOUSE_PASSWORD=//p' /credentials/.env)"
        exec /usr/local/bin/node /app/agent-chat/dist/supervisor.js "$$@"
      - lens
    environment:
      LENS_MODE: standalone
      LENS_PUBLIC_URL: ${LENS_PUBLIC_URL:-http://localhost:4318}
      LENS_SIGN_IN_LINK: ${LENS_SIGN_IN_LINK:-true}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: lens
      CLICKHOUSE_DATABASE: lens
      AGENT_TRACING_RETENTION_DAYS: ${AGENT_TRACING_RETENTION_DAYS:-14}
    volumes:
      - credentials:/credentials:ro
    ports:
      - "${LENS_BIND_ADDRESS:-127.0.0.1}:${LENS_PORT:-4318}:4318"
    depends_on:
      credentials:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    networks: [default, storage]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=${LENS_TMP_SIZE:-1g}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  clickhouse:
    image: clickhouse/clickhouse-server:26.9.6.6@sha256:eb4870e7ca7ed70c259eebfcfbee6cf797017f6b5436c2926bbbfe3d4d28486e
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        export CLICKHOUSE_PASSWORD="$$(sed -n 's/^CLICKHOUSE_PASSWORD=//p' /credentials/.env)"
        exec /entrypoint.sh "$$@"
      - clickhouse
    environment:
      CLICKHOUSE_USER: lens
      CLICKHOUSE_DB: lens
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - credentials:/credentials:ro
    configs:
      - source: keeper
        target: /etc/clickhouse-server/config.d/lens-keeper.xml
    depends_on:
      credentials:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --host clickhouse --user lens --password \"$$(sed -n 's/^CLICKHOUSE_PASSWORD=//p' /credentials/.env)\" --query 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks: [storage]

networks:
  storage:
    internal: true

volumes:
  clickhouse_data:
  credentials:

configs:
  keeper:
    content: |
      <clickhouse>
          <keeper_server>
              <tcp_port>9181</tcp_port>
              <server_id>1</server_id>
              <log_storage_path>/var/lib/clickhouse/coordination/log</log_storage_path>
              <snapshot_storage_path>/var/lib/clickhouse/coordination/snapshots</snapshot_storage_path>
              <coordination_settings>
                  <operation_timeout_ms>10000</operation_timeout_ms>
                  <quorum_reads>true</quorum_reads>
                  <compress_logs>false</compress_logs>
                  <snapshot_distance>10000</snapshot_distance>
                  <rotate_log_storage_interval>10000</rotate_log_storage_interval>
                  <reserved_log_items>1000</reserved_log_items>
              </coordination_settings>
              <raft_configuration>
                  <server><id>1</id><hostname>127.0.0.1</hostname><port>9234</port></server>
              </raft_configuration>
          </keeper_server>
          <zookeeper><node><host>127.0.0.1</host><port>9181</port></node></zookeeper>
          <keeper_map_path_prefix>/lens/keeper-map</keeper_map_path_prefix>
      </clickhouse>
