[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "litellm-lens"
version = "0.1.0"
description = "Lens tracing and investigations, standalone and embedded in LiteLLM"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "asyncpg>=0.30,<1",
  "fastapi==0.136.3",
  "httpx==0.28.1",
  "litellm==1.106.0.dev2",
  "orjson==3.11.6",
  "packaging==26.2",
  "pydantic==2.13.4",
  "pyjwt==2.15.0",
  "uvicorn==0.51.0",
]

[dependency-groups]
dev = [
  "datamodel-code-generator==0.66.0",
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "ruff==0.15.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/litellm_lens"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/litellm_lens/trace/generated/*.py" = ["E501", "UP"]
