[package]
name = "litellm-storage-clickhouse"
version = "0.1.0"
description = "Shared ClickHouse connection and HTTP storage for LiteLLM features"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
lens-auth = { path = "../auth" }
lens-contract = { path = "../contract" }
lens-datasets = { path = "../datasets" }
lens-evals = { path = "../evals" }
lens-investigations = { path = "../investigations" }
lens-signals = { path = "../signals" }
flate2.workspace = true
litellm-http.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_with.workspace = true
sha2.workspace = true
rand.workspace = true
percent-encoding.workspace = true
sqlx = { workspace = true, features = ["migrate"] }
thiserror.workspace = true
tokio.workspace = true
url.workspace = true

[dev-dependencies]
litellm-http = { workspace = true, features = ["test-support"] }
rstest.workspace = true
testcontainers-modules = { version = "0.15.0", features = ["clickhouse"] }
tokio.workspace = true
wiremock.workspace = true
uuid.workspace = true
