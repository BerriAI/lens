[package]
name = "lens-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64.workspace = true
chrono = { version = "0.4", features = ["serde"] }
cookie = "0.18.1"
jiter = "=0.17.0"
lens-auth = { path = "../auth" }
lens-contract = { path = "../contract" }
lens-datasets = { path = "../datasets" }
litellm-traces.workspace = true
rand.workspace = true
serde_json = { workspace = true, features = ["preserve_order", "raw_value"] }
axum = { workspace = true, features = ["json"] }
http.workspace = true
serde.workspace = true
speedate = "=0.17.0"
strum = "=0.27.2"
thiserror.workspace = true
tower-http = { version = "=0.6.11", features = ["fs", "set-header"] }
url.workspace = true
uuid.workspace = true

[dev-dependencies]
jsonwebtoken.workspace = true
tempfile.workspace = true
lens-parity = { path = "../parity" }
litellm-http = { workspace = true, features = ["test-support"] }
litellm-storage-clickhouse.workspace = true
reqwest.workspace = true
testcontainers-modules = { version = "0.15.0", features = ["clickhouse"] }
rstest.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { version = "=0.5.3", features = ["util"] }
