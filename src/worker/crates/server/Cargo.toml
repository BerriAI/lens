[package]
name = "lens-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64.workspace = true
chrono = { version = "0.4", features = ["serde"] }
cookie = "0.18.1"
futures-util.workspace = true
percent-encoding.workspace = true
tower = { version = "=0.5.3", features = ["util"] }
jiter = "=0.17.0"
lens-auth = { path = "../auth" }
lens-contract = { path = "../contract" }
lens-datasets = { path = "../datasets" }
lens-evals = { path = "../evals" }
lens-evals-sdk = { path = "../evals-sdk" }
jsonschema = { version = "0.55.1", default-features = false }
schemars.workspace = true
lens-investigations = { path = "../investigations" }
lens-signals = { path = "../signals" }
litellm-storage-clickhouse.workspace = true
litellm-traces-clickhouse.workspace = true
litellm-traces.workspace = true
rand.workspace = true
serde_json = { workspace = true, features = ["preserve_order", "raw_value"] }
axum = { workspace = true, features = ["json", "query"] }
http.workspace = true
hmac = "0.12"
jsonwebtoken = { workspace = true, features = ["aws_lc_rs", "use_pem"] }
reqwest.workspace = true
serde.workspace = true
sha2.workspace = true
speedate = "=0.17.0"
strum = "=0.27.2"
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tower-http = { version = "=0.6.11", features = ["fs", "set-header"] }
url.workspace = true
uuid.workspace = true

[dev-dependencies]
wiremock.workspace = true
tempfile.workspace = true
lens-parity = { path = "../parity" }
litellm-http = { workspace = true, features = ["test-support"] }
litellm-storage-clickhouse.workspace = true
testcontainers-modules = { version = "0.15.0", features = ["clickhouse"] }
rstest.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
