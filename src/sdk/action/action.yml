name: Lens evals
description: Run agent evals and publish the server's verdict to GitHub
inputs:
  api-key:
    description: Lens API key
    required: true
  base-url:
    description: Lens server URL, defaults to tool.lens.base_url
    required: false
  path:
    description: Eval file or directory, defaults to tool.lens.evals
    required: false
  eval-name:
    description: Saved Lens eval name, mutually exclusive with path
    required: false
  python:
    description: Python executable in the agent environment
    default: python
  github-token:
    description: Token with checks and pull requests write permissions
    default: ${{ github.token }}
  sdk-token:
    description: Token with contents read access to BerriAI/lens for downloading release wheels
    default: ${{ github.token }}
  install-from-source:
    description: Build the SDK from this Action's pinned checkout instead of downloading a release wheel
    default: 'false'
  report-via-app:
    description: Publish through the GitHub App connected to this agent in Lens
    default: 'false'
outputs:
  passed:
    description: Whether every server gate passed
    value: ${{ steps.report.outputs.passed }}
  run-urls:
    description: JSON array of Lens run URLs
    value: ${{ steps.report.outputs.run-urls }}
runs:
  using: composite
  steps:
    - name: Validate eval selection
      shell: bash
      env:
        LENS_EVAL_PATH: ${{ inputs.path }}
        LENS_EVAL_NAME: ${{ inputs.eval-name }}
      run: |
        if [[ -n "$LENS_EVAL_PATH" && -n "$LENS_EVAL_NAME" ]]; then
          echo '::error::Choose eval-name or path, not both'
          exit 2
        fi
    - name: Install SDK
      shell: bash
      env:
        LENS_PYTHON: ${{ inputs.python }}
        GH_TOKEN: ${{ inputs.sdk-token }}
        LENS_INSTALL_FROM_SOURCE: ${{ inputs.install-from-source }}
      run: bash "$GITHUB_ACTION_PATH/install.sh"
    - name: Run evals
      id: eval
      shell: bash
      env:
        LENS_PYTHON: ${{ inputs.python }}
        LENS_API_KEY: ${{ inputs.api-key }}
        LENS_BASE_URL: ${{ inputs.base-url }}
        LENS_EVAL_PATH: ${{ inputs.path }}
        LENS_EVAL_NAME: ${{ inputs.eval-name }}
      run: |
        set +e
        if [[ -n "$LENS_EVAL_NAME" ]] && ! "$LENS_PYTHON" -c 'from lens import Lens, _native; assert callable(getattr(_native, "run_named", None))' 2>/dev/null; then
          echo '::error::This SDK wheel does not support saved evals. Install the updated SDK from a pinned checkout, or use install-from-source with this Action checkout'
          exit 2
        fi
        args=(--ci --json)
        if [[ -n "$LENS_EVAL_NAME" ]]; then args+=(--name "$LENS_EVAL_NAME"); fi
        if [[ -n "$LENS_EVAL_PATH" ]]; then args+=("$LENS_EVAL_PATH"); fi
        "$LENS_PYTHON" -m lens.cli eval "${args[@]}" > "$RUNNER_TEMP/lens-runs.json"
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        if [[ "$code" -eq 2 ]]; then exit 2; fi
    - name: Publish report
      id: report
      shell: bash
      env:
        LENS_PYTHON: ${{ inputs.python }}
        LENS_API_KEY: ${{ inputs.api-key }}
        LENS_BASE_URL: ${{ inputs.base-url }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        LENS_REPORT_VIA_APP: ${{ inputs.report-via-app }}
      run: |
        args=("$RUNNER_TEMP/lens-runs.json")
        if [[ "$LENS_REPORT_VIA_APP" == "true" ]]; then args+=(--via-app); fi
        "$LENS_PYTHON" -m lens.github "${args[@]}"
    - name: Enforce gate
      shell: bash
      env:
        LENS_EXIT_CODE: ${{ steps.eval.outputs.exit-code }}
      run: exit "$LENS_EXIT_CODE"
