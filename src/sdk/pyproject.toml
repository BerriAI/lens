[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "lens-evals"
version = "0.1.0a3"
description = "Run agent evaluations against Lens from Python and CI"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
dependencies = ["pydantic>=2.11,<3"]

[project.optional-dependencies]
dev-server = []
examples = ["httpx>=0.28,<0.29"]
agent-evals = [
    "litellm @ git+https://github.com/BerriAI/litellm.git@c93be231dab6866883945d9bb82c29a8eb19acdd",
    "starlette>=1.0.1,<2",
    "uvicorn>=0.33,<1",
]

[project.scripts]
lens = "lens.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "pytest-cov>=6,<8", "ruff>=0.12,<1", "mypy>=1.15,<2", "datamodel-code-generator==0.81.0", "httpx>=0.28,<0.29"]

[tool.maturin]
manifest-path = "../worker/crates/evals-python/Cargo.toml"
python-source = "src"
include = [
    { path = "*.py", from = "out-dir", to = "lens_cli/", crate_name = "lens-cli" },
    { path = "py.typed", from = "out-dir", to = "lens_cli/", crate_name = "lens-cli" },
]
module-name = "lens._native"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "../cli/tests/python"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "../cli/python"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
exclude = ["**/_contract.py", "**/fixtures/eval_contract.py"]

[tool.ruff.lint.isort]
known-first-party = ["lens", "lens_cli"]

[tool.mypy]
strict = true

[tool.coverage.run]
patch = ["subprocess"]
source = ["lens", "lens_cli"]
