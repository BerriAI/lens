[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "lens-evals"
version = "0.1.0a1"
description = "Run agent evaluations against Lens from Python and CI"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
dependencies = ["httpx>=0.28,<0.29", "pydantic>=2.11,<3"]

[project.optional-dependencies]
dev-server = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[project.scripts]
lens = "lens.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "pytest-cov>=6,<8", "ruff>=0.12,<1", "mypy>=1.15,<2", "datamodel-code-generator==0.81.0", "fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/lens"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
exclude = ["src/lens/_contract.py", "tests/fixtures/eval_contract.py"]

[tool.mypy]
strict = true

[tool.coverage.run]
patch = ["subprocess"]
source = ["lens"]
