[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "lens-evals"
version = "0.1.0a3"
description = "Run agent evaluations against Lens from Python and CI"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
dependencies = ["pydantic>=2.11,<3"]

[project.optional-dependencies]
dev-server = []
examples = ["httpx>=0.28,<0.29"]

[project.scripts]
lens = "lens.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "pytest-cov>=6,<8", "ruff>=0.12,<1", "mypy>=1.15,<2", "datamodel-code-generator==0.81.0", "httpx>=0.28,<0.29"]

[tool.maturin]
manifest-path = "../worker/crates/evals-python/Cargo.toml"
python-source = "src"
module-name = "lens._native"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
exclude = ["src/lens/_contract.py", "tests/fixtures/eval_contract.py"]

[tool.mypy]
strict = true

[tool.coverage.run]
patch = ["subprocess"]
source = ["lens"]
